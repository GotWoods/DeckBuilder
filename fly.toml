# fly.toml app configuration file generated for deckbuilder on 2025-09-21T16:04:13-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'deckbuilder'
primary_region = 'sea'

[build]

[deploy]
  strategy = 'immediate'
  release_command = "echo 'Starting DeckBuilder application...'"

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  MONGODB_URI = 'mongodb://localhost:27017/deckbuilder'
  REDIS_URL = 'redis://localhost:6379'

[[mounts]]
  source = 'deckbuilder_data'
  destination = '/data'


[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
